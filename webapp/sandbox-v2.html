  <!-- Theme tokens and the bare page. Tailwind's preflight comes with each app's CSS. -->
  <style>/* sandbox-v2.css */
/*
 * Runtime 2 sandbox base (sandbox-v2.html).
 *
 * Only the theme tokens and the bare page. Every app's own CSS — Tailwind's preflight, its classes,
 * the kit's — is built by the host and arrives with the run (src/appbuilder/buildApp.ts), where
 * src/appbuilder/runtime/appTheme.ts names these tokens the way shadcn/ui names its colours.
 *
 * These are the fallbacks. AppIFrame sends the host's own Kindredly theme colours over them, so an
 * app follows the family's theme; the fallbacks are what an app looks like anywhere else (the eval
 * harness, an attachment preview).
 */

:root,
:root[data-knd-theme="light"],
:root[data-knd-theme="pastel"],
:root[data-knd-theme="primary"] {
  --knd-bg: #f9f9f9;
  --knd-surface: #ffffff;
  --knd-surface-2: #f4f4f5;
  --knd-hover: #efeff1;
  --knd-text: #18181b;
  --knd-muted: #63636b;
  --knd-border: #e4e4e7;
  --knd-input-border: #d9d9de;
  --knd-accent: #2771b7;
  --knd-accent-text: #ffffff;
  --knd-good: #15803d;
  --knd-warn: #b45309;
  --knd-bad: #dc2626;
}

:root[data-knd-theme="dark"],
:root[data-knd-theme="neon"] {
  --knd-bg: #121212;
  --knd-surface: #1c1c1f;
  --knd-surface-2: #27272a;
  --knd-hover: #2c2c30;
  --knd-text: #f4f4f5;
  --knd-muted: #a1a1aa;
  --knd-border: rgba(255, 255, 255, 0.1);
  --knd-input-border: rgba(255, 255, 255, 0.16);
  --knd-accent: #4f9be0;
  --knd-accent-text: #0b1220;
  --knd-good: #4ade80;
  --knd-warn: #fbbf24;
  --knd-bad: #f87171;
}

:root {
  --knd-radius: 0.75rem;
}

html,
body {
  margin: 0;
  background-color: var(--knd-bg);
  color: var(--knd-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* What window.onerror appends when an app throws (sandbox-runtime.js). */
.error {
  margin: 12px 16px;
  padding: 10px 12px;
  border: 1px solid var(--knd-bad);
  border-radius: 8px;
  color: var(--knd-bad);
  background: color-mix(in srgb, var(--knd-bad) 8%, transparent);
  font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap;
}

/* ===== game surface (built by knd.game) — the same as sandbox-ui.css, which runtime 2 does not load.
   Colors are literal on purpose: these controls sit ON a game canvas, whose background is app
   content rather than a theme token. */
.knd-game { position: relative; margin: 0 auto; touch-action: none; }
.knd-game canvas { display: block; width: 100%; height: 100%; }
.knd-game-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  padding: 12px;
}
.knd-game-overlay > * { pointer-events: auto; }

/* A round on-screen control for a touch game. */
.knd-pad {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  padding: 0;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background: rgba(0, 0, 0, 0.38);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

    var keyCode = KEY_CODES[key] || (key.length === 1 ? key.toUpperCase().charCodeAt(0) : 0)

    try {
      ev = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true, composed: true })
    } catch (e) {
      ev = new Event(type, { bubbles: true, cancelable: true })
      try { Object.defineProperty(ev, 'key', { get: function () { return key } }) } catch (e2) { /* ignore */ }
    }
    // Older code still reads keyCode, which the constructor cannot set.
    try { Object.defineProperty(ev, 'keyCode', { get: function () { return keyCode } }) } catch (e) { /* ignore */ }
    try { Object.defineProperty(ev, 'which', { get: function () { return keyCode } }) } catch (e) { /* ignore */ }
    return ev
  }

  /**
   * Enter in a field submits its form only when the browser would: the form has a submit button,
   * or this is its only text field. A synthetic key press gets none of this for free, and pressing
   * Enter in a form a person could not submit must not pass.
   */
  function implicitSubmit(field) {
    var form = field.form
    if (!form) return false
    var submitter = form.querySelector('button:not([type]), button[type="submit"], input[type="submit"], input[type="image"]')
    var textFields = all('input', form).filter(function (el) { return NOT_TYPEABLE.indexOf(inputType(el)) < 0 })
    if (!submitter && textFields.length !== 1) return false
    if (submitter && submitter.disabled) return false
    if (typeof form.requestSubmit === 'function') form.requestSubmit(submitter || undefined)

    return true
  }

  // --- The field being typed into, by identity rather than by node -------------------------------
  // A re-render legitimately replaces the node (knd.paint does, and puts the caret back), so
  // comparing element references would fail every correct app. What a person notices is whether
  // THE FIELD still has the caret.
  var lastField = null

  function identify(el) {
    return { tag: el.tagName, id: el.id || '', name: el.getAttribute('name') || '', label: fieldNames(el)[0] || '', index: fields().indexOf(el) }
  }
  function isSameField(el, ident) {
    if (!el || !ident || el.tagName !== ident.tag) return false
    if (ident.id) return el.id === ident.id
    if (ident.name) return el.getAttribute('name') === ident.name

  function refind(ident) {
    if (!ident) return null

    for (var i = 0; i < list.length; i++) if (isSameField(list[i], ident)) return list[i]

  // --- Steps -------------------------------------------------------------------------------------

  async function doClick(step) {
    var target = step.target != null ? step.target : step.text

    if (el.disabled || el.getAttribute('aria-disabled') === 'true') return fail(quote(nameOf(el) || target) + ' is disabled.')
    var before = snapshot()
    clickEl(el)
    await sleep(SETTLE_MS)
    return changedSince(before) ? ok('') : ok('Nothing on screen changed.')
  }

  async function setWholeValue(el, text) {
    el.value = text
    fire(el, 'input')
    fire(el, 'change')
    await sleep(SETTLE_MS)
  }

  async function doType(step) {
    var el = findField(step.target)
    if (!el) return fail((norm(step.target) ? 'No field matches ' + quote(step.target) + '. ' : 'There is no field to type into. ') + describeFields())
    if (el.disabled) return fail(quote(fieldNames(el)[0] || step.target) + ' is disabled.')
    if (el.readOnly) return fail(quote(fieldNames(el)[0] || step.target) + ' is read-only.')
    var text = String(step.text == null ? '' : step.text).slice(0, MAX_TYPED)
    if (el.tagName === 'SELECT') return selectOption(el, text)
    lastField = identify(el)
    var type = inputType(el)

    if (el.isContentEditable) {
      el.textContent = text
      fire(el, 'input')
      await sleep(SETTLE_MS)
      return ok('')
    }

    // A number, a date, a colour: the browser takes the whole value or nothing, so give it whole.
    if (TEXTISH.indexOf(type) < 0) {
      await setWholeValue(el, text)
      var after = refind(lastField)
      if (after && text && after.value !== text) return fail(quote(fieldNames(el)[0] || type) + ' did not take ' + quote(text) + ' — a ' + type + ' field.')
      return ok('')
    }

    // Text arrives one character at a time, the way a keyboard delivers it. An app that re-renders
    // the field on every keystroke is caught here the way a person catches it: mid-word.
    var tracksFocus = tryFocus(el)
    el.value = ''
    fire(el, 'input')
    var lost = ''
    var current = el
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i)
      if (tracksFocus) {
        var active = document.activeElement
        if (isSameField(active, lastField)) {
          current = active
        } else {
          if (!lost) {
            lost = i === 0
              ? 'Clearing ' + quote(lastField.label || type) + ' took the caret out of it — a re-render replaced the field.'
              : 'After typing ' + quote(text.slice(0, i)) + ', the field lost the caret — a re-render replaced it, so a person\'s next letters would go nowhere.'
          }
          current = refind(lastField)
          if (current) tryFocus(current)
        }
      } else {
        current = refind(lastField) || current
      }
      if (!current || !current.isConnected) return fail('The field disappeared after typing ' + quote(text.slice(0, i)) + '.')
      var down = keyEvent('keydown', ch)
      current.dispatchEvent(down)
      if (!down.defaultPrevented) {
        current.dispatchEvent(keyEvent('keypress', ch))

        try {
          input = new InputEvent('input', { bubbles: true, cancelable: false, data: ch, inputType: 'insertText' })
        } catch (e) {
          input = new Event('input', { bubbles: true })

        current.dispatchEvent(input)

      current.dispatchEvent(keyEvent('keyup', ch))
      await sleep(TYPE_CHAR_MS)
    }
    var final = refind(lastField) || current
    if (final) fire(final, 'change')
    await sleep(SETTLE_MS)
    if (lost) return fail(lost)
    final = refind(lastField)
    if (final && text && low(final.value).indexOf(low(text)) < 0) {
      return fail('After typing ' + quote(text) + ', the field holds ' + quote(final.value) + ' — a re-render overwrote it.')
    }
    return ok('')
  }

  async function selectOption(el, wanted) {
    var q = low(wanted)
    var opts = Array.prototype.slice.call(el.options || [])
    var match = opts.find(function (o) { return low(o.text) === q || low(o.value) === q }) ||
      opts.find(function (o) { return low(o.text).indexOf(q) >= 0 })

      return fail('No option ' + quote(wanted) + '. Options: ' + opts.slice(0, 10).map(function (o) { return quote(o.text, 30) }).join(', ') + '.')

    var before = snapshot()
    el.value = match.value
    fire(el, 'input')
    fire(el, 'change')
    await sleep(SETTLE_MS)
    return changedSince(before) ? ok('') : ok('Nothing on screen changed.')
  }

  async function doSelect(step) {
    var el = findField(step.target)
    if (el && el.tagName === 'SELECT') return selectOption(el, step.text)
    // A radio group reads as a choice too: pick the radio whose label is the option.
    var radio = findClickable(step.text)
    if (radio && radio.tagName === 'INPUT' && inputType(radio) === 'radio') return doClick({ target: step.text })

  function pressTarget() {
    var field = refind(lastField)

    var active = document.activeElement

  async function doPress(step) {
    var key = normalizeKey(step.key != null ? step.key : step.text)
    if (!key) return fail('press needs a key, for example { "action": "press", "key": "Enter" }.')
    var el = pressTarget()
    if (norm(step.target)) {
      el = findField(step.target) || findClickable(step.target)
      if (!el) return fail('Nothing on screen matches ' + quote(step.target) + '. ' + describeButtons())
    }
    var before = snapshot()
    var down = keyEvent('keydown', key)
    el.dispatchEvent(down)
    if (key.length === 1 || key === 'Enter') el.dispatchEvent(keyEvent('keypress', key))
    // Holding a key is how a game moves a sprite more than a pixel.
    var hold = Math.max(0, Math.min(3000, Number(step.ms) || 0))
    if (hold) await sleep(hold)
    el.dispatchEvent(keyEvent('keyup', key))
    if (!down.defaultPrevented) {
      var tag = el.tagName
      if (key === 'Enter' && tag === 'INPUT') implicitSubmit(el)
      else if ((key === 'Enter' || key === ' ') && (tag === 'BUTTON' || el.getAttribute('role') === 'button')) el.click()

    return changedSince(before) ? ok('') : ok('Nothing on screen changed.')
  }

  async function doExpect(step, present) {
    var raw = step.text != null ? step.text : step.target
    var want = low(raw)
    if (!want) return fail((present ? 'expect' : 'expectnot') + ' needs text, for example { "action": "expect", "text": "Milk" }.')
    var deadline = Date.now() + EXPECT_WAIT_MS
    for (;;) {
      var has = low(screenText()).indexOf(want) >= 0
      if (has === present) return ok('')
      if (Date.now() >= deadline) break
      await sleep(100)
    }
    return present
      ? fail(quote(raw) + ' is not on screen. The screen shows: ' + quote(screenText(), 300))
      : fail(quote(raw) + ' is still on screen.')
  }

  async function doWait(step) {
    await sleep(Math.max(0, Math.min(5000, Number(step.ms) || 500)))
    return ok('')
  }

  /**
   * The generic check (APPQ-17, moved here from the eval harness so the product and the eval run
   * the same one). It knows nothing about what any app means. It fills whatever fields it finds,
   * presses the one button that looks like the primary action, and reports three things that are
   * unambiguous whatever the app is: it threw (the host collects that), nothing happened, or the
   * text it typed came back as live HTML.
   *
   * The probe text is deliberately markup. An app that concatenates user input into `innerHTML`
   * turns it into a real <b> element; one that escapes, or uses textContent, shows the characters.
   */
  async function probe() {
    var doc = document
    var app = doc.getElementById('app')
    if (!app) return { attempted: false, reason: 'no #app' }

    // A game or a drawing pad is driven entirely through pixels. Pressing its left-arrow pad moves
    // a sprite and changes no text at all, so "nothing happened" would be a lie about a working
    // app. Nothing here can tell a moved sprite from a dead button, so it declines to guess.
    if (doc.querySelector('canvas')) return { attempted: false, reason: 'canvas app — no form to drive' }

    var layout = hasLayout()
    var before = {
      text: textOf(app),
      children: app.querySelectorAll('*').length,
      bolds: app.querySelectorAll('b').length,
    }

    // Fill every field the user could type in. A number field gets a number: an app that parses
    // "<b>Probe</b>" as pages-read and renders NaN is a different bug, and not this one's.
    //
    // One field at a time, found again each time: an app that redraws on every keystroke replaces
    // the fields, and filling the node that was there a moment ago fills nothing. After each one,
    // check the fields already filled still hold what was typed. A recipe box redrew its whole
    // screen when the search box changed, which wiped the half-typed recipe, and the probe used to
    // report that as "Add recipe does nothing" — true, and blaming the wrong thing.
    var filled = 0
    var done = []
    var cleared = null
    var targets = all('input, textarea, select', app)
      .filter(function (el) {
        var type = inputType(el)

      var el = refind(ident)
      if (!el) return
      var type = inputType(el)

      } else if (type === 'number' || el.getAttribute('inputmode') === 'numeric') {
        el.value = '7'
      } else if (type === 'date') {
        el.value = '2026-01-02'
      } else {
        el.value = PROBE_TEXT
      }
      fire(el, 'input')
      fire(el, 'change')
      filled++
      // What the field holds once the app has reacted — an app that formats "7" as "7.00" has
      // not wiped anything.
      var settled = refind(ident)
      var value = settled ? settled.value : el.value
      if (!cleared) {
        // Only a field that went EMPTY: that is the redraw wiping it, not the app reformatting.
        var lost = done.filter(function (d) {
          var now = refind(d.ident)
          return now && d.value !== '' && now.value === ''
        })
        if (lost.length) cleared = { by: ident.label || type, lost: lost.map(function (d) { return d.ident.label || 'a field' }) }
      }
      done.push({ ident: ident, value: value })
    })

    // The primary action, as a person would read it: a submit button, else the first button that
    // is not obviously a setting, a reset or a navigation control. The avoid-list gates
    // EVERYTHING, including the submit preference: a chore chart put "Reset all chores" and
    // "Add chore" in two separate forms, both type=submit, and preferring submit first pressed
    // Reset, saw the empty list stay empty, and reported a working app as broken.
    // Searching is not the main action either: pressing "Search" over an empty list rightly
    // changes nothing, and reported a working recipe box as a dead button.
    var AVOID = /setting|reset|clear|delete|remove|close|cancel|menu|option|undo|back|next|prev|shuffle|search|find|filter/i
    var visible = all('button, [role="button"]', app).filter(function (b) { return isShown(b, layout) && !b.disabled })
    var safe = visible.filter(function (b) { return !AVOID.test(nameOf(b)) })
    var primary = safe.find(function (b) { return (b.getAttribute('type') || '') === 'submit' }) || safe[0]
    // Only destructive or navigational controls on screen means there is no primary action to test.
    if (!primary) return { attempted: false, reason: 'no primary action to press', filled: filled }

    var label = (nameOf(primary) || 'button').slice(0, 30)
    var threw = null
    try {
      primary.click()
    } catch (e) {
      threw = String((e && e.message) || e).slice(0, 300)
    }
    await sleep(450)

    // Does typing survive? A parent hit this in the real app: the notes app mirrored the title
    // field into knd.store on every keystroke, the store fired onChange, render() replaced
    // app.innerHTML, and the caret left the field after a single letter.
    //
    // Allowlisted, not denylisted. A number or date input REJECTS the letter this types, which
    // would read as "wiped by a re-render" and fail a perfectly good app.
    var keepsFocus = true
    var focusDetail = ''
    var typeable = all('input, textarea', app).filter(function (el) {
      if (!isShown(el, layout)) return false
      if (el.tagName === 'TEXTAREA') return true
      return ['text', 'search', 'url', 'tel', 'email', 'password'].indexOf(inputType(el)) >= 0
    })
    if (typeable.length) {
      var field = typeable[0]
      var mark = { id: field.id || '', name: field.getAttribute('name') || '', tag: field.tagName }
      // Focus from a hidden frame may be refused (Chromium asks for a user gesture). Then there is
      // no caret to lose and nothing to report — never a failure.
      if (tryFocus(field)) {
        field.value = (field.value || '') + 'a'
        fire(field, 'input')
        await sleep(350)
        var now = document.activeElement
        var same =
          !!now &&
          now.tagName === mark.tag &&
          (mark.id ? now.id === mark.id : true) &&
          (mark.name ? (now.getAttribute && now.getAttribute('name')) === mark.name : true)
        if (!same) {
          keepsFocus = false
          focusDetail =
            now && (now.tagName === 'INPUT' || now.tagName === 'TEXTAREA')
              ? 'the caret jumped to a different field'
              : 'the field lost the caret — a re-render replaced it and nothing put focus back'
        } else if (String(now.value || '').indexOf('a') < 0) {
          keepsFocus = false
          focusDetail = 'the typed character was wiped by a re-render'
        }
      }
    }

    var after = {
      text: textOf(app),
      children: app.querySelectorAll('*').length,
      bolds: app.querySelectorAll('b').length,
    }
    return {
      attempted: true,
      filled: filled,
      clearedFields: cleared
        ? 'Typing into ' + quote(cleared.by) + ' cleared ' + cleared.lost.map(function (l) { return quote(l) }).join(', ')
        : '',
      clicked: label,
      threw: threw,
      // A real <b> that was not there before means the probe was parsed as markup, not shown as text.
      injectedHtml: after.bolds > before.bolds,
      keepsFocus: keepsFocus,
      focusDetail: focusDetail,
      // Either the page redrew, or it said something. Both count as "the button did something".
      changed: after.text !== before.text || after.children !== before.children,
      textAfter: after.text.slice(0, 200),
    }
  }

  async function run(step) {
    var s = step && typeof step === 'object' ? step : {}
    switch (String(s.action || '').toLowerCase()) {
      case 'click': return doClick(s)
      case 'type': return doType(s)
      case 'press': return doPress(s)
      case 'select': return doSelect(s)
      case 'expect': return doExpect(s, true)
      case 'expectnot': return doExpect(s, false)
      case 'wait': return doWait(s)
      case 'probe': return ok('', { probe: await probe() })
      default: return fail('Unknown step ' + quote(s.action) + '.')
    }
  }

  window.__kndTest = { run: run, probe: probe }
})()

  <!--
    Theme sync, as in sandbox.html, plus the host's own colours: AppIFrame sends the family's
    Kindredly theme colours as --knd-* tokens, so an app looks like the theme they picked rather
    than like the fallback palettes in sandbox-v2.css.

        applyTheme(new URLSearchParams(location.search).get('knd_theme'));
        window.addEventListener('message', function (e) {
          var d = e && e.data;
          if (e.source !== window.parent) return;
          if (d && d.type === 'knd-set-theme' && typeof d.theme === 'string') applyTheme(d.theme, d.tokens);

    })();

  <script>/* sandbox-runtime.js */
/**
 * The sandbox's run loop, shared by every sandbox page (sandbox.html, sandbox-nonet.html,
 * sandbox-v2.html, sandbox-v2-nonet.html). Loaded LAST in <body>, after #app exists and after
 * sandbox-host-api.js has defined window.createKindredlyHostApi.
 *
 * Classic (non-module) script. The iframe runs with an opaque `null` origin, so ES-module
 * imports and wasm fetches would be CORS-blocked against capacitor://localhost on mobile.
 * Instead, the host (AppIFrame) builds the app in the real origin and sends already-compiled
 * JS here; this script only EXECUTES it. Inlined into each page at build time, like every other
 * sandbox file (src/core/sandboxDocument.ts).

let hostToken = null;
let parentOrigin = null;

function createRequestId() {

    return (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '_' + String(Math.random()).slice(2)
  } catch {

const hostApi = window.createKindredlyHostApi({ createRequestId })
hostApi.install()

// sandbox-icons.js itself. window.kndIcon / window.kndIcons keep working either way.

// effects and timers, the kit's stores. The @kindredly/ui kit registers each one (runtime 2).
// A runtime 1 app registers nothing, so for it this is a no-op.
const runCleanups = [];
window.__kndRuntime = {
  onCleanup: function (fn) {
    if (typeof fn === 'function') runCleanups.push(fn);

};
// Counts run-code messages, so one that waited can tell a newer one has arrived.
let runCodeSeq = 0;

function cleanupPreviousRun() {
  while (runCleanups.length) {
    const fn = runCleanups.pop();
    try {
      fn();
    } catch (e) {
      // A broken cleanup must not stop the next run.
    }

// Runtime 2: the libraries an app imports (React, the kit, …) arrive WITH the run, as text — a
// `<script src>` cannot load in this frame on WebKit (src/core/sandboxDocument.ts). Each runs once
// per document; a later run reuses it.
const loadedLibs = new Set();
function loadRunLibs(libs) {
  if (!Array.isArray(libs)) return;
  for (const lib of libs) {
    if (!lib || typeof lib.id !== 'string' || typeof lib.code !== 'string' || loadedLibs.has(lib.id)) continue;
    const el = document.createElement('script');
    el.textContent = lib.code + '\n//# sourceURL=knd-lib/' + lib.id + '.js';
    document.head.appendChild(el);
    loadedLibs.add(lib.id);

// Runtime 2: the app's own CSS (Tailwind, built by the host), replaced on every run.
function applyRunCss(css) {
  if (typeof css !== 'string') return;
  let el = document.getElementById('knd-app-css');
  if (!el) {
    el = document.createElement('style');
    el.id = 'knd-app-css';
    document.head.appendChild(el);

// flushed debounced. Fail-soft: with no host itemId (e.g. attachment previews) the hydrate

    try {

          if (!warnedTooBig) {
            warnedTooBig = true;
            console.warn('localStorage exceeds the ~800KB persistence limit; data is kept in memory only. Store less here, or use kindredly.refState for larger data.');
          }
          return;
        }
        warnedTooBig = false;
        window.kindredly.refState.set(LOCAL_STORAGE_STATE_KEY, snapshot).catch(() => {});
      } catch { /* ignore */ }
    };
    shim.onWrite(() => {
      if (flushTimer) clearTimeout(flushTimer);
      flushTimer = setTimeout(flush, 400);
    });
    window.addEventListener('pagehide', () => {
      if (flushTimer) { clearTimeout(flushTimer); flush(); }
    });
  })();
  return storageHydration;
}

// Runtime error positions: app code executes via new Function(code), so reported line
// numbers are offset by the function wrapper and refer to COMPILED js. Measure the wrapper
// offset once with a probe error; the host (AppIFrame) maps the compiled position back to
// the user's source via the esbuild source map.
let fnLineOffset = 0;
function parseEvaluatedPosition(stack) {
  if (!stack || typeof stack !== 'string') return null;
  const m = /<anonymous>:(\d+):(\d+)/.exec(stack)
    || /> (?:eval|Function):(\d+):(\d+)/.exec(stack)
    || /\banonymous@.*:(\d+):(\d+)/.exec(stack);
  return m ? { line: parseInt(m[1], 10), column: parseInt(m[2], 10) } : null;
}
try {
  new Function('throw new Error("__probe__")')();
} catch (probeErr) {
  const probePos = parseEvaluatedPosition(probeErr && probeErr.stack);
  if (probePos && probePos.line >= 1) fnLineOffset = probePos.line - 1;
}
function compiledPositionFromStack(stack) {
  const pos = parseEvaluatedPosition(stack);
  if (!pos || pos.line <= fnLineOffset) return null;
  return { line: pos.line - fnLineOffset, column: pos.column };
}

// Snapshot of what actually rendered, sent with run-complete so the editor agent can
// verify the UI instead of trusting a clean console (catches "runs fine, shows nothing").
function buildDomSummary() {
  try {
    const app = document.getElementById('app');
    const texts = function (nodes, cap) {
      const out = [];
      for (let i = 0; i < nodes.length && out.length < cap; i++) {
        const t = (nodes[i].textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
        if (t) out.push(t);
      }
      return out;
    };
    // A button by what a person — or a screen reader — calls it. An icon-only button (a trash
    // can labelled "Remove entry") has no text at all, and listing buttons by text alone hid
    // it from the model, which then reported that the app had no way to remove anything.
    const buttonNames = function (nodes, cap) {
      const out = [];
      for (let i = 0; i < nodes.length && out.length < cap; i++) {
        const n = nodes[i];
        const t = (n.getAttribute('aria-label') || n.textContent || n.getAttribute('title') || '').replace(/\s+/g, ' ').trim().slice(0, 60);
        if (t) out.push(t);
      }
      return out;
    };
    const childCount = app ? app.children.length : 0;
    const textPreview = app ? (app.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 300) : '';
    const hasCanvas = !!document.querySelector('canvas'); // Kaboom appends its canvas to <body>
    return {
      appChildCount: childCount,
      textPreview: textPreview,
      headings: app ? texts(app.querySelectorAll('h1,h2,h3'), 5) : [],
      buttons: app ? buttonNames(app.querySelectorAll('button,[role="button"]'), 8) : [],
      inputCount: app ? app.querySelectorAll('input,select,textarea').length : 0,
      hasCanvas: hasCanvas,
      renderedNothing: childCount === 0 && !textPreview && !hasCanvas,
    };
  } catch (e) {
    return null;
  }
}

function safeToString(value) {
  try {
    if (typeof value === 'string') return value;
    if (value instanceof Error) return value.stack || value.message || String(value);
    return JSON.stringify(value);
  } catch {
    try {
      return String(value);
    } catch {
      return '[unserializable]';
    }
  }
}

function postToParent(payload) {
  try {
    if (window.parent && window.parent !== window) {
      const targetOrigin = parentOrigin || '*'
      // Payloads may pin their own runId (delayed run-complete must not adopt a newer run's id).
      const runId = payload && payload.runId !== undefined ? payload.runId : currentRunId;
      window.parent.postMessage({ ...payload, runId, token: hostToken }, targetOrigin);
    }
  } catch {
    // ignore
  }
}

// Host API is installed via sandbox-host-api.js

// Mirror console output to parent for agent verification.
(function wrapConsole() {
  const levels = ['log', 'warn', 'error', 'info', 'debug'];
  for (const level of levels) {
    const original = console[level];
    console[level] = function(...args) {
      try {
        postToParent({
          type: 'sandbox-console',
          level,
          args: args.map(a => safeToString(a)).slice(0, 20),
          ts: Date.now(),
        });
      } catch {
        // ignore
      }
      return original.apply(console, args);
    };
  }
})();

window.onerror = function(msg, url, line, col, error) {
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = 'Error: ' + msg;
  document.body.appendChild(div);
  postToParent({
    type: 'sandbox-error',
    kind: 'runtime',
    message: String(msg || 'Unknown error'),
    stack: error && error.stack ? String(error.stack) : undefined,
    position: compiledPositionFromStack(error && error.stack),
    ts: Date.now(),
  });
  return false;
};

window.onunhandledrejection = function(event) {
  const reason = event && event.reason ? event.reason : 'Unhandled rejection';
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = 'Unhandled Promise Rejection: ' + safeToString(reason);
  document.body.appendChild(div);
  postToParent({
    type: 'sandbox-error',
    kind: 'unhandledrejection',
    message: safeToString(reason),
    position: compiledPositionFromStack(reason && reason.stack),
    ts: Date.now(),
  });
  return false;
};

// Listen for code from parent window
window.addEventListener('message', async function(event) {
  // Only accept commands from our parent, on the same origin.
  if (window.parent === window) {
    return;
  }
  if (event.source !== window.parent) {
    return;
  }

  // If we're running without allow-same-origin, our origin will be opaque ("null").
  // Capture the parent origin on first message and use a shared token for validation.
  if (!parentOrigin && typeof event.origin === 'string' && event.origin) {
    parentOrigin = event.origin
    hostApi.setParentOrigin(parentOrigin)
  }

  if (event.data && event.data.type === 'test-step') {
    // The App Builder trying the app (sandbox-test.js). Only the host that started the
    // current run may drive it. Errors the step raises reach the host through window.onerror
    // as usual, before this result does.
    if (!hostToken || event.data.token !== hostToken) return;
    let result;
    try {
      const runner = window.__kndTest;
      result = runner ? await runner.run(event.data.step || {}) : { ok: false, note: 'The test runner did not load.' };
    } catch (err) {
      result = { ok: false, note: 'The step could not run: ' + safeToString(err) };
    }
    postToParent({
      type: 'sandbox-test-step-result',
      stepId: event.data.stepId,
      result: result,
      dom: buildDomSummary(),
      ts: Date.now(),
    });
    return;
  }

  if (event.data && event.data.type === 'run-code') {
    const runSeq = ++runCodeSeq;
    hostToken = event.data.token || hostToken
    hostApi.setHostToken(hostToken)
    const runStartedAt = Date.now();
    // Hydrate persisted localStorage before app code runs (no-op after the first run).
    await setupPersistentStorage();
    // A newer run arrived while this one waited for storage: it replaces this one. Without this,
    // both would run, the first never torn down, and its result reported under the second's id.
    if (runSeq !== runCodeSeq) return;

    // Take down what the previous run left mounted, then clear what it drew.
    cleanupPreviousRun();
    const app = document.getElementById('app');
    while (app.firstChild) {
      app.removeChild(app.firstChild);
    }

    // Remove previous error messages
    const errors = document.querySelectorAll('.error');
    errors.forEach(err => err.remove());

    currentRunId = event.data.runId || null;
    try {
      // Runtime 2 sends its libraries and CSS with the code; runtime 1 sends neither.
      loadRunLibs(event.data.libs);
      applyRunCss(event.data.css);
      // event.data.code is already compiled to JS by the host (AppIFrame). Just execute it.
      const fn = new Function(event.data.code);
      fn();

      // Give async rendering (Alpine init, rAF paints) a beat before snapshotting the DOM,
      // so the run report reflects what the user actually sees. runId is pinned in case a
      // newer run starts during the delay.
      const durationMs = Date.now() - runStartedAt;
      const completedRunId = currentRunId;
      setTimeout(function () {
        postToParent({
          type: 'sandbox-run-complete',
          success: true,
          durationMs: durationMs,
          dom: buildDomSummary(),
          runId: completedRunId,
          ts: Date.now(),
        });
      }, 250);
    } catch (err) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = 'Error: ' + safeToString(err);
      document.body.appendChild(div);
      console.error(err);

      postToParent({
        type: 'sandbox-error',
        kind: 'runtime',
        message: err && err.message ? String(err.message) : safeToString(err),
        stack: err && err.stack ? String(err.stack) : undefined,
        position: compiledPositionFromStack(err && err.stack),
        ts: Date.now(),
      });
      postToParent({
        type: 'sandbox-run-complete',
        success: false,
        durationMs: Date.now() - runStartedAt,
        dom: buildDomSummary(),
        ts: Date.now(),
      });
    }
  }
});

// Signal ready
if (window.parent !== window) {
  // We don't know the parent origin yet; it will be captured on first message.
  window.parent.postMessage({ type: 'sandbox-ready' }, '*');
}

  </script>
</body>
