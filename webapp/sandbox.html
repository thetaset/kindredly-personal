attribute vec2 a_pos;
attribute vec2 a_uv;
attribute vec4 a_color;

varying vec2 v_pos;
varying vec2 v_uv;
varying vec4 v_color;

vec4 def_vert() {
	return vec4(a_pos, 0.0, 1.0);
}

{{user}}

void main() {
	vec4 pos = vert(a_pos, a_uv, a_color);
	v_pos = a_pos;
	v_uv = a_uv;
	v_color = a_color;
	gl_Position = pos;
}

precision mediump float;

varying vec2 v_pos;
varying vec2 v_uv;
varying vec4 v_color;

uniform sampler2D u_tex;

vec4 def_frag() {
	return v_color * texture2D(u_tex, v_uv);
}

{{user}}

void main() {
	gl_FragColor = frag(v_pos, v_uv, v_color, u_tex);
	if (gl_FragColor.a == 0.0) {
		discard;
	}
}

vec4 vert(vec2 pos, vec2 uv, vec4 color) {
	return def_vert();
}

  <style>/* sandbox-ui.css */
/*
  Kindredly sandbox UI kit — a thin component layer for apps built in the App Builder.

  Pico CSS already styles raw HTML elements well. What it does not give an app is the small set of
  layout and surface pieces every little app ends up hand-rolling: a card, a row, a stat, a chip, a
  toolbar, an empty state. Hand-rolled versions are where sandbox apps drift into hardcoded colours
  and stop working in dark mode, so those pieces live here, built on the --knd-* tokens declared in
  sandbox.html.

  Everything is prefixed .knd-. Nothing here restyles a bare element, so an app that ignores this
  file entirely looks exactly as it did before.

  Documented for the agent in appManual/docs/ui-kit.doc.md — keep the two in step.
*/

:root {
  --knd-space-1: 0.25rem;
  --knd-space-2: 0.5rem;
  --knd-space-3: 0.75rem;
  --knd-space-4: 1rem;
  --knd-space-5: 1.5rem;
  --knd-space-6: 2rem;

  --knd-radius: 0.75rem;
  --knd-radius-sm: 0.5rem;
  --knd-radius-pill: 999px;

  --knd-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.08);
  --knd-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);

  --knd-good: #1f9d55;
  --knd-warn: #c97a09;
  --knd-bad: #d64545;
}

:root[data-knd-theme="dark"],
:root[data-knd-theme="neon"] {
  --knd-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.45);
  --knd-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);

  --knd-good: #4ade80;
  --knd-warn: #fbbf24;
  --knd-bad: #f87171;
}

/* A readable default stack, replacing the bare `sans-serif` the sandbox shipped with.
   System fonts only — a webfont cannot load into an opaque-origin iframe. */
html,
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ============================ layout ============================ */

.knd-stack { display: flex; flex-direction: column; gap: var(--knd-space-3); }
.knd-stack-sm { display: flex; flex-direction: column; gap: var(--knd-space-1); }
.knd-row { display: flex; align-items: center; gap: var(--knd-space-2); flex-wrap: wrap; }
.knd-row-tight { display: flex; align-items: center; gap: var(--knd-space-1); }
.knd-spread { display: flex; align-items: center; justify-content: space-between; gap: var(--knd-space-2); }
.knd-center { display: flex; align-items: center; justify-content: center; }
.knd-grow { flex: 1 1 auto; min-width: 0; }
.knd-wrap { max-width: 42rem; margin: 0 auto; }

/* Auto-fitting card grid: as many columns as fit, never narrower than 10rem. */
.knd-grid {
  display: grid;
  gap: var(--knd-space-3);
  grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
}

.knd-grid-2 { grid-template-columns: repeat(2, 1fr); }
.knd-grid-3 { grid-template-columns: repeat(3, 1fr); }

/* ===== game surface (built by knd.game) =====
   Colors here are literal on purpose: these controls sit ON a game canvas, whose background is
   app content rather than a theme token, so a themed color would be unreadable half the time. */
.knd-game { position: relative; margin: 0 auto; touch-action: none; }
.knd-game canvas { display: block; width: 100%; height: 100%; }
.knd-game-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--knd-space-2);
  padding: var(--knd-space-3);
}
.knd-game-overlay > * { pointer-events: auto; }

/* A round on-screen control for a touch game. */
.knd-pad {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  padding: 0;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background: rgba(0, 0, 0, 0.38);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ============================ surfaces ============================ */

.knd-card {
  background: var(--knd-surface);
  color: var(--knd-text);
  border: 1px solid var(--knd-border);
  border-radius: var(--knd-radius);
  padding: var(--knd-space-4);
  box-shadow: var(--knd-shadow-sm);
}

.knd-card-flat { box-shadow: none; }

/* Hover lift, for a card that is also a button or link. */
.knd-card-action {
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
}

.knd-card-action:hover {
  transform: translateY(-1px);
  box-shadow: var(--knd-shadow);
  border-color: var(--knd-accent);
}

.knd-panel {
  background: var(--knd-surface-2);
  border-radius: var(--knd-radius);
  padding: var(--knd-space-3);
}

.knd-toolbar {
  display: flex;
  align-items: center;
  gap: var(--knd-space-2);
  padding: var(--knd-space-2) var(--knd-space-3);
  background: var(--knd-surface);
  border: 1px solid var(--knd-border);
  border-radius: var(--knd-radius-pill);
}

.knd-divider {
  height: 1px;
  background: var(--knd-border);
  border: 0;
  margin: var(--knd-space-3) 0;
}

/* ============================ text ============================ */

.knd-title { font-size: 1.35rem; font-weight: 700; line-height: 1.2; margin: 0; }
.knd-subtitle { font-size: 1rem; font-weight: 600; line-height: 1.3; margin: 0; }
.knd-muted { color: var(--knd-muted); }
.knd-small { font-size: 0.85rem; }
.knd-accent { color: var(--knd-accent); }
.knd-good { color: var(--knd-good); }
.knd-warn { color: var(--knd-warn); }
.knd-bad { color: var(--knd-bad); }
.knd-nowrap { white-space: nowrap; }

.knd-eyebrow {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--knd-muted);
}

/* A big number with a label under it — the standard "score / streak / total" tile. */
.knd-stat { display: flex; flex-direction: column; gap: 0.125rem; }
.knd-stat-value { font-size: 2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.knd-stat-label { font-size: 0.8rem; color: var(--knd-muted); }

/* ============================ controls ============================ */

/* Buttons are opt-in: Pico already styles <button>. Use .knd-btn when a link or a div has to
   look like a button, or when you want the ghost/quiet variants. */
.knd-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--knd-space-2);
  padding: 0.5rem 0.9rem;
  border: 1px solid transparent;
  border-radius: var(--knd-radius-sm);
  background: var(--knd-accent);
  color: var(--knd-accent-text);
  font: inherit;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  text-decoration: none;
  transition: filter 120ms ease, background-color 120ms ease, border-color 120ms ease;
}

.knd-btn:hover { filter: brightness(1.08); }
.knd-btn:active { filter: brightness(0.95); }

.knd-btn:disabled,
.knd-btn[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed;
  filter: none;
}

.knd-btn-ghost {
  background: transparent;
  color: var(--knd-text);
  border-color: var(--knd-border);
}

.knd-btn-ghost:hover {
  background: var(--knd-surface-2);
  filter: none;
}

.knd-btn-quiet {
  background: transparent;
  color: var(--knd-muted);
  border-color: transparent;
}

.knd-btn-quiet:hover {
  background: var(--knd-surface-2);
  color: var(--knd-text);
  filter: none;
}

.knd-btn-sm { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
.knd-btn-lg { padding: 0.7rem 1.3rem; font-size: 1.1rem; }
.knd-btn-pill { border-radius: var(--knd-radius-pill); }
.knd-btn-block { width: 100%; }

/* Square icon-only button. Pair with <knd-icon>. */
.knd-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  border: 0;
  border-radius: var(--knd-radius-sm);
  background: transparent;
  color: var(--knd-text);
  cursor: pointer;
  transition: background-color 120ms ease;
}

.knd-icon-btn:hover { background: var(--knd-surface-2); }

.knd-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--knd-space-1);
  padding: 0.2rem 0.6rem;
  border-radius: var(--knd-radius-pill);
  background: var(--knd-surface-2);
  color: var(--knd-text);
  font-size: 0.8rem;
  font-weight: 600;
  line-height: 1.4;
}

.knd-chip-accent { background: var(--knd-accent); color: var(--knd-accent-text); }
.knd-chip-good { background: var(--knd-good); color: #fff; }
.knd-chip-warn { background: var(--knd-warn); color: #fff; }
.knd-chip-bad { background: var(--knd-bad); color: #fff; }

/* ============================ lists ============================ */

.knd-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.knd-list-item {
  display: flex;
  align-items: center;
  gap: var(--knd-space-3);
  padding: var(--knd-space-3) 0;
  border-bottom: 1px solid var(--knd-border);
}

.knd-list-item:last-child { border-bottom: 0; }

/* ============================ feedback ============================ */

.knd-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--knd-space-2);
  padding: var(--knd-space-6) var(--knd-space-4);
  text-align: center;
  color: var(--knd-muted);
}

.knd-empty svg { opacity: 0.45; }

.knd-progress {
  height: 0.5rem;
  border-radius: var(--knd-radius-pill);
  background: var(--knd-surface-2);
  overflow: hidden;
}

.knd-progress-bar {
  height: 100%;
  background: var(--knd-accent);
  border-radius: inherit;
  transition: width 200ms ease;
}

/* ============================ motion ============================ */

.knd-fade-in { animation: knd-fade-in 180ms ease both; }
.knd-pop { animation: knd-pop 180ms cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }

@keyframes knd-fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

@keyframes knd-pop {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .knd-fade-in,
  .knd-pop { animation: none; }
  .knd-card-action { transition: none; }
}

    :root[data-knd-theme="pastel"],
    :root[data-knd-theme="primary"] {
      --knd-bg: #f9f9f9;
      --knd-surface: #ffffff;
      --knd-surface-2: #f1f3f5;
      --knd-text: #1a1a1a;
      --knd-muted: #5a5f66;
      --knd-border: rgba(0, 0, 0, 0.12);
      --knd-accent: #2f6fed;
      --knd-accent-text: #ffffff;

    :root[data-knd-theme="neon"] {
      --knd-bg: #121212;
      --knd-surface: #1e1e1e;
      --knd-surface-2: #262626;

      --knd-muted: #a8adb3;
      --knd-border: rgba(255, 255, 255, 0.14);
      --knd-accent: #5b8cff;

      padding: 10px;

      padding: 10px;
      background: #3b1f1f;
      border: 1px solid #8b3a3a;
      margin: 10px 0;
      border-radius: 4px;

  <div id="app"></div>
  <!--
    Classic (non-module) script. The iframe runs with an opaque `null` origin, so ES-module
    imports and wasm fetches would be CORS-blocked against capacitor://localhost on mobile.
    Instead, the host (AppIFrame) compiles TS→JS in the real origin and sends already-compiled
    JS here; this script only EXECUTES it. window.createKindredlyHostApi comes from the classic
    sandbox-host-api.js loaded in <head>.

    let currentRunId = null;
    let hostToken = null;
    let parentOrigin = null;

    function createRequestId() {
      try {
        return (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '_' + String(Math.random()).slice(2)
      } catch {
        return String(Date.now()) + '_' + String(Math.random()).slice(2)
      }

    const hostApi = window.createKindredlyHostApi({ createRequestId })
    hostApi.install()

    // install() REPLACES window.kindredly, so the icon API is attached after it rather than by
    // sandbox-icons.js itself. window.kndIcon / window.kndIcons keep working either way.
    if (window.kndIcons) window.kindredly.icons = window.kndIcons

    // localStorage persistence: the head shim keeps writes in memory; back it with the per-app
    // refState host API so data survives reloads. Hydrated once before the first run; writes are
    // flushed debounced. Fail-soft: with no host itemId (e.g. attachment previews) the hydrate
    // times out and storage stays in-memory for this load.
    const LOCAL_STORAGE_STATE_KEY = '__knd_localstorage';
    const LOCAL_STORAGE_MAX_CHARS = 800 * 1024;
    let storageHydration = null;
    function setupPersistentStorage() {
      const shim = window.__kndStorageShims && window.__kndStorageShims.localStorage;
      if (!shim) return Promise.resolve();
      if (storageHydration) return storageHydration;
      storageHydration = (async () => {
        try {
          const stored = await Promise.race([
            window.kindredly.refState.get(LOCAL_STORAGE_STATE_KEY),
            new Promise((resolve) => setTimeout(resolve, 3000)),
          ]);
          if (stored && typeof stored === 'object') shim.hydrate(stored);
        } catch { /* in-memory only */ }

        let flushTimer = null;
        let warnedTooBig = false;
        const flush = () => {
          flushTimer = null;
          try {
            const snapshot = shim.snapshot();
            if (JSON.stringify(snapshot).length > LOCAL_STORAGE_MAX_CHARS) {
              if (!warnedTooBig) {
                warnedTooBig = true;
                console.warn('localStorage exceeds the ~800KB persistence limit; data is kept in memory only. Store less here, or use kindredly.refState for larger data.');
              }
              return;
            }
            warnedTooBig = false;
            window.kindredly.refState.set(LOCAL_STORAGE_STATE_KEY, snapshot).catch(() => {});
          } catch { /* ignore */ }
        };
        shim.onWrite(() => {
          if (flushTimer) clearTimeout(flushTimer);
          flushTimer = setTimeout(flush, 400);
        });
        window.addEventListener('pagehide', () => {
          if (flushTimer) { clearTimeout(flushTimer); flush(); }
        });
      })();
      return storageHydration;
    }

    // numbers are offset by the function wrapper and refer to COMPILED js. Measure the wrapper
    // offset once with a probe error; the host (AppIFrame) maps the compiled position back to
    // the user's source via the esbuild source map.
    let fnLineOffset = 0;
    function parseEvaluatedPosition(stack) {

      const m = /<anonymous>:(\d+):(\d+)/.exec(stack)
        || /> (?:eval|Function):(\d+):(\d+)/.exec(stack)
        || /\banonymous@.*:(\d+):(\d+)/.exec(stack);
      return m ? { line: parseInt(m[1], 10), column: parseInt(m[2], 10) } : null;

    try {
      new Function('throw new Error("__probe__")')();
    } catch (probeErr) {

      if (probePos && probePos.line >= 1) fnLineOffset = probePos.line - 1;

      const pos = parseEvaluatedPosition(stack);
      if (!pos || pos.line <= fnLineOffset) return null;
      return { line: pos.line - fnLineOffset, column: pos.column };

    // Snapshot of what actually rendered, sent with run-complete so the editor agent can
    // verify the UI instead of trusting a clean console (catches "runs fine, shows nothing").
    function buildDomSummary() {
      try {
        const app = document.getElementById('app');
        const texts = function (nodes, cap) {
          const out = [];
          for (let i = 0; i < nodes.length && out.length < cap; i++) {
            const t = (nodes[i].textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
            if (t) out.push(t);
          }
          return out;
        };
        const childCount = app ? app.children.length : 0;
        const textPreview = app ? (app.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 300) : '';

          appChildCount: childCount,
          textPreview: textPreview,
          headings: app ? texts(app.querySelectorAll('h1,h2,h3'), 5) : [],
          buttons: app ? texts(app.querySelectorAll('button,[role="button"]'), 8) : [],
          inputCount: app ? app.querySelectorAll('input,select,textarea').length : 0,
          hasCanvas: hasCanvas,
          renderedNothing: childCount === 0 && !textPreview && !hasCanvas,

        return null;
      }

    function safeToString(value) {
      try {
        if (typeof value === 'string') return value;
        if (value instanceof Error) return value.stack || value.message || String(value);
        return JSON.stringify(value);
      } catch {
        try {
          return String(value);
        } catch {
          return '[unserializable]';
        }
      }
    }

      try {
        if (window.parent && window.parent !== window) {
          const targetOrigin = parentOrigin || '*'

          window.parent.postMessage({ ...payload, runId, token: hostToken }, targetOrigin);
        }
      } catch {
        // ignore
      }
    }

    // Host API is installed via sandbox-host-api.js

    // Mirror console output to parent for agent verification.
    (function wrapConsole() {
      const levels = ['log', 'warn', 'error', 'info', 'debug'];
      for (const level of levels) {
        const original = console[level];
        console[level] = function(...args) {
          try {
            postToParent({
              type: 'sandbox-console',
              level,
              args: args.map(a => safeToString(a)).slice(0, 20),
              ts: Date.now(),
            });
          } catch {
            // ignore
          }
          return original.apply(console, args);
        };
      }
    })();

    window.onerror = function(msg, url, line, col, error) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = 'Error: ' + msg;

        kind: 'runtime',
        message: String(msg || 'Unknown error'),

      document.body.appendChild(div);
      postToParent({
        type: 'sandbox-error',
        kind: 'unhandledrejection',
        message: safeToString(reason),

        ts: Date.now(),

      return false;

    window.addEventListener('message', async function(event) {
      // Only accept commands from our parent, on the same origin.
      if (window.parent === window) {
        return;
      }

      // Capture the parent origin on first message and use a shared token for validation.

        hostApi.setParentOrigin(parentOrigin)
      }

      if (event.data && event.data.type === 'run-code') {
        // Clear previous content (only when starting a new run)
        const app = document.getElementById('app');
        while (app.firstChild) {
          app.removeChild(app.firstChild);
        }

        // Remove previous error messages
        const errors = document.querySelectorAll('.error');
        errors.forEach(err => err.remove());

        hostToken = event.data.token || hostToken
        hostApi.setHostToken(hostToken)
        currentRunId = event.data.runId || null;
        const runStartedAt = Date.now();
        // Hydrate persisted localStorage before app code runs (no-op after the first run).
        await setupPersistentStorage();
        try {
          // event.data.code is already compiled to JS by the host (AppIFrame). Just execute it.
          const fn = new Function(event.data.code);
          fn();

          // Give async rendering (Alpine init, rAF paints) a beat before snapshotting the DOM,
          // so the run report reflects what the user actually sees. runId is pinned in case a
          // newer run starts during the delay.
          const durationMs = Date.now() - runStartedAt;
          const completedRunId = currentRunId;
          setTimeout(function () {
            postToParent({
              type: 'sandbox-run-complete',
              success: true,
              durationMs: durationMs,
              dom: buildDomSummary(),
              runId: completedRunId,
              ts: Date.now(),
            });
          }, 250);
        } catch (err) {
          const div = document.createElement('div');
          div.className = 'error';
          div.textContent = 'Error: ' + safeToString(err);
          document.body.appendChild(div);
          console.error(err);

          postToParent({
            type: 'sandbox-error',
            kind: 'runtime',
            message: err && err.message ? String(err.message) : safeToString(err),
            stack: err && err.stack ? String(err.stack) : undefined,
            position: compiledPositionFromStack(err && err.stack),
            ts: Date.now(),
          });
          postToParent({
            type: 'sandbox-run-complete',
            success: false,
            durationMs: Date.now() - runStartedAt,
            dom: buildDomSummary(),
            ts: Date.now(),
          });
        }
      }
    });

    // Signal ready
    if (window.parent !== window) {

      window.parent.postMessage({ type: 'sandbox-ready' }, '*');
