services:

  proxy:
    image: nginx:alpine
    ports:
      - '4444:80'
    volumes:
      - ./kindredly-server-personal/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp:/usr/share/nginx/html:ro
    restart: 'unless-stopped'
    networks:
      - kindredly_backend
  dbmigration:
    image: kindredly-server
    profiles:
      - migrate
      - createdb
    platform: ${KND_PLATFORM:-linux/x86_64}
    build:
      context: ./
      dockerfile: kindredly-server-personal/Dockerfile
    environment:
      DB_AUTH_USER: postgres
      DB_AUTH_PASS: admin
      DB_DBNAME: kindredlydb
      DB_HOSTNAME: postgres
      DB_CLIENT: postgresql
      PERSONAL_SERVER: 'true'
      REDIS_PORT: 6379
      REDIS_HOST: redis
      NODE_ENV: development
      MIGRATE_OPTION: 
    command: >
      bash -c "/app/kindredly-server-personal/launch_migrate.sh ${MIGRATE_OPTION}"
    networks:
      - kindredly_backend
    links:
      - postgres
      - redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
      - ~/kindredly-personal-data:/root/ThetaSetData
      # - kindredly_personal_node_modules:/app/kindredly-server-personal/node_modules
  kindredly-task-server:
    image: kindredly-server
    platform: ${KND_PLATFORM:-linux/x86_64}
    build:
      context: ./
      dockerfile: kindredly-server-personal/Dockerfile
    command: >
      bash -c '/app/kindredly-server-personal/launch_task_runner.sh'
    environment:
      DB_AUTH_USER: postgres
      DB_AUTH_PASS: admin
      DB_DBNAME: kindredlydb
      DB_HOSTNAME: postgres
      DB_CLIENT: postgresql
      PERSONAL_SERVER: 'true'
      REDIS_PORT: 6379
      REDIS_HOST: redis
      NODE_ENV: development
    # ports:
    #   - '3000:3000'
    restart: 'unless-stopped'
    networks:
      - kindredly_backend
    links:
      - postgres
      - redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
      - ~/kindredly-personal-data:/root/ThetaSetData
      # - kindredly_personal_node_modules:/app/kindredly-server-personal/node_modules
  kindredly-server-personal:
    image: kindredly-server
    platform: ${KND_PLATFORM:-linux/x86_64}
    build:
      context: ./
      dockerfile: kindredly-server-personal/Dockerfile
    environment:
      DB_AUTH_USER: postgres
      DB_AUTH_PASS: admin
      DB_DBNAME: kindredlydb
      DB_HOSTNAME: postgres
      DB_CLIENT: postgresql
      PERSONAL_SERVER: 'true'
      REDIS_PORT: 6379
      REDIS_HOST: redis
      NODE_ENV: development
    command: >
      bash -c "/app/kindredly-server-personal/launch_server.sh"
    ports:
      - '3000:3000'
    restart: 'unless-stopped'
    networks:
      - kindredly_backend
    links:
      - postgres
      - redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
      - ~/kindredly-personal-data:/root/ThetaSetData
      # - kindredly_personal_node_modules:/app/kindredly-server-personal/node_modules
  redis:
    image: redis/redis-stack-server:6.2.6-v7
    environment:
      - REDIS_ARGS=--save 1200 32
      - '6379:6379'
    volumes:
      - kindredly_redis:/data
    networks:
      - kindredly_backend
  postgres:
    image: postgres:14.6-bullseye
    # container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: kindredlydb
    # Appliance sizing. Postgres ships defaults meant for a server
    # (shared_buffers=128MB, max_connections=100); this box is a small board.
    #
    # max_connections=40 is a floor, not a preference: config.ts sets pool
    # max=10 per process, this file runs TWO app processes against this
    # database (kindredly-server-personal and kindredly-task-server) = 20,
    # plus dbmigration at startup, plus ~6 background workers Postgres runs
    # itself. Measured: 23 client connections already puts pg_stat_activity at
    # 28, so 30 left only two spare and a box that fails to boot under a
    # connection storm is worse than a box using 1MB more. Do not lower this
    # without lowering the pool in config.ts first.
    command:
      - postgres
      - '-c'
      - 'shared_buffers=32MB'
      - '-c'
      - 'max_connections=40'
      - '-c'
      - 'work_mem=2MB'
      - '-c'
      - 'maintenance_work_mem=16MB'
      - '-c'
      - 'effective_cache_size=256MB'
    ports:
      - '5435:5432'
    volumes:
      # MUST be /var/lib/postgresql/data -- that is this image's PGDATA. It was
      # mounted at /data, which Postgres never writes to, so the whole database
      # lived in the container's writable layer and `docker compose down`
      # destroyed it. See the LITE-14 note in docs/trackers/lite-profile-tracker.md
      # before upgrading an existing box: its data is in the old container, not
      # in this volume.
      - kindredly_postgres:/var/lib/postgresql/data
    networks:
      - kindredly_backend

networks:
  kindredly_backend:
    driver: bridge

volumes:
  kindredly_personal_node_modules:
  kindredly_postgres:
    driver: local
  kindredly_redis:
    driver: local
